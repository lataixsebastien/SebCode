# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # Permission ruleset for the Tool context (STEP-14). Each row is
    # { type, pattern, action } with type/pattern as wildcard globs and action
    # one of allow|deny|ask. Last matching rule wins; unmatched -> ask -> the
    # default prompter decision (TOOL_PERMISSION_DEFAULT).
    #
    # STEP-15: file edits inside the project root are allowed (write/edit are
    # already confined to the workspace by WorkspacePath/realpath). shell
    # (bash) and external_directory stay unconfigured -> deny by default until
    # an interactive prompter lands.
    tool.permission.rules:
        - { type: 'edit', pattern: '*', action: 'allow' }

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # All classes under App/src are registered as services unless excluded below.
    App\:
        resource: '../src/'
        exclude:
            - '../src/**/Domain/Model/'
            - '../src/**/Domain/Exception/'
            - '../src/**/Application/Command/*Command.php'
            - '../src/**/Application/Query/*Query.php'
            - '../src/**/Application/Dto/'
            - '../src/**/Infrastructure/Persistence/Doctrine/Entity/'
            - '../src/Kernel.php'

    # ─── Assistant bounded context: bind Domain Ports to Infrastructure adapters ───

    App\Assistant\Domain\Port\Clock:
        alias: App\Assistant\Infrastructure\Clock\SystemClock

    App\Assistant\Domain\Port\IdGenerator:
        alias: App\Assistant\Infrastructure\Id\SymfonyUidGenerator

    App\Assistant\Domain\Port\SessionRepository:
        alias: App\Assistant\Infrastructure\Persistence\Doctrine\Repository\DoctrineSessionRepository

    App\Assistant\Domain\Port\MessageRepository:
        alias: App\Assistant\Infrastructure\Persistence\Doctrine\Repository\DoctrineMessageRepository

    App\Assistant\Domain\Port\LlmPort:
        alias: App\Assistant\Infrastructure\Llm\SymfonyAiOllamaAdapter

    # Foundational system prompt (coding-agent role + tool guidance + workspace).
    App\Assistant\Domain\Port\SystemPrompt:
        alias: App\Assistant\Infrastructure\Prompt\SebCodeSystemPrompt

    App\Assistant\Infrastructure\Prompt\SebCodeSystemPrompt:
        arguments:
            $projectRoot: '%kernel.project_dir%'

    # Live output stream (STEP-27): the agent loop reports text deltas + tool
    # calls/results to the attached UI sink.
    App\Assistant\Domain\Port\AgentOutputStreamRegistry:
        alias: App\Assistant\Infrastructure\Stream\MutableAgentOutputStreamRegistry

    # The Ollama-backed adapter takes the AI bundle Platform service for ollama.
    App\Assistant\Infrastructure\Llm\SymfonyAiOllamaAdapter:
        arguments:
            $platform: '@ai.platform.ollama'

    # Model picker source (STEP-29): lists local Ollama models via /api/tags.
    App\Assistant\Infrastructure\Llm\OllamaModelCatalog:
        arguments:
            $endpoint: '%env(OLLAMA_ENDPOINT)%'

    App\Assistant\Domain\Port\ModelCatalog:
        alias: App\Assistant\Infrastructure\Llm\OllamaModelCatalog

    # Default LLM model picked by CLI/TUI commands (overridable per-invocation).
    App\Assistant\UI\Cli\AskCommand:
        arguments:
            $defaultModel: '%env(LLM_MODEL)%'

    App\Assistant\UI\Cli\ChatCommand:
        arguments:
            $defaultModel: '%env(LLM_MODEL)%'

    App\Assistant\UI\Tui\TuiCommand:
        arguments:
            $defaultModel: '%env(LLM_MODEL)%'

    # ─── Tool bounded context: auto-tag implementations + locator-backed registry ───

    _instanceof:
        App\Tool\Domain\Port\Tool:
            tags: ['app.tool']

    App\Tool\Infrastructure\Registry\ServiceLocatorToolRegistry:
        arguments:
            $tools: !tagged_iterator 'app.tool'
            $locator: !service_locator
                glob: '@App\Tool\Infrastructure\Tool\GlobTool'
                grep: '@App\Tool\Infrastructure\Tool\GrepTool'
                read: '@App\Tool\Infrastructure\Tool\ReadTool'
                write: '@App\Tool\Infrastructure\Tool\WriteTool'
                edit: '@App\Tool\Infrastructure\Tool\EditTool'
                bash: '@App\Tool\Infrastructure\Tool\ShellTool'
                todowrite: '@App\Tool\Infrastructure\Tool\TodoWriteTool'
                apply_patch: '@App\Tool\Infrastructure\Tool\ApplyPatchTool'
                task: '@App\Tool\Infrastructure\Tool\TaskTool'
                lsp: '@App\Tool\Infrastructure\Tool\LspTool'

    App\Tool\Domain\Port\ToolRegistry:
        alias: App\Tool\Infrastructure\Registry\ServiceLocatorToolRegistry

    # ─── Tool permission layer (STEP-14/16): ruleset + gate + prompter ───
    # Consumed by write/edit (type edit) and bash (type bash). The gate also
    # reads runtime grants ("always" replies). The interactive prompter asks
    # the live console (STEP-16, CLI) and falls back to the config default when
    # no UI is attached (headless / one-shot / tests).

    App\Tool\Domain\Model\PermissionRuleset:
        factory: ['App\Tool\Infrastructure\Permission\RulesetFactory', 'fromConfig']
        arguments:
            $rules: '%tool.permission.rules%'

    App\Tool\Infrastructure\Permission\ConfigDefaultPermissionPrompter:
        factory: ['App\Tool\Infrastructure\Permission\ConfigDefaultPermissionPrompter', 'fromString']
        arguments:
            $default: '%env(TOOL_PERMISSION_DEFAULT)%'

    # Interactive prompter: prompts the live console, else defers to the default.
    App\Tool\Infrastructure\Permission\InteractivePermissionPrompter:
        arguments:
            $fallback: '@App\Tool\Infrastructure\Permission\ConfigDefaultPermissionPrompter'

    App\Tool\Domain\Port\PermissionPrompter:
        alias: App\Tool\Infrastructure\Permission\InteractivePermissionPrompter

    App\Tool\Domain\Port\PermissionConsole:
        alias: App\Tool\Infrastructure\Permission\NullPermissionConsole

    App\Tool\Domain\Port\PermissionConsoleRegistry:
        alias: App\Tool\Infrastructure\Permission\MutablePermissionConsoleRegistry

    # Persisted per project (STEP-25): an "always" choice survives across runs.
    # InMemoryPermissionGrants stays for unit tests.
    App\Tool\Infrastructure\Persistence\Doctrine\Repository\DoctrinePermissionGrants:
        arguments:
            $projectRoot: '%kernel.project_dir%'

    App\Tool\Domain\Port\PermissionGrants:
        alias: App\Tool\Infrastructure\Persistence\Doctrine\Repository\DoctrinePermissionGrants

    # Agent todo list: persisted per session in Postgres (STEP-23). The
    # in-memory store stays for unit tests / as a fallback.
    App\Tool\Domain\Port\TodoStore:
        alias: App\Tool\Infrastructure\Persistence\Doctrine\Repository\DoctrineTodoStore

    App\Tool\Domain\Port\CommandRunner:
        alias: App\Tool\Infrastructure\Process\ProcOpenCommandRunner

    # `lsp` tool diagnostics backend: php -l + phpstan (STEP-26).
    App\Tool\Infrastructure\Diagnostics\PhpDiagnosticsProvider:
        arguments:
            $projectRoot: '%kernel.project_dir%'

    App\Tool\Domain\Port\DiagnosticsProvider:
        alias: App\Tool\Infrastructure\Diagnostics\PhpDiagnosticsProvider

    App\Tool\Domain\Port\PermissionGate:
        alias: App\Tool\Infrastructure\Permission\RulesetPermissionGate

    # ─── Tool ↔ Assistant bridge (the ONE place Assistant imports Tool\) ───

    App\Assistant\Infrastructure\Tool\AssistantToolGatewayAdapter:
        arguments:
            $projectRoot: '%kernel.project_dir%'

    App\Assistant\Domain\Port\ToolGateway:
        alias: App\Assistant\Infrastructure\Tool\AssistantToolGatewayAdapter

    # Second bridge: the `task` tool's nested agent loop (Tool port, Assistant impl).
    App\Assistant\Infrastructure\SubAgent\AssistantSubAgentRunner:
        arguments:
            $defaultModel: '%env(LLM_MODEL)%'

    App\Tool\Domain\Port\SubAgentRunner:
        alias: App\Assistant\Infrastructure\SubAgent\AssistantSubAgentRunner
