services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sebcode_php
    working_dir: /var/www/App
    volumes:
      - ./App:/var/www/App
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: sebcode_nginx
    ports:
      - "8080:80"
    volumes:
      - ./App:/var/www/App
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  postgres:
    image: postgres:16-alpine
    container_name: sebcode_postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sebcode_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
